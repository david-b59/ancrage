<!-- Icône de l'application : le point ambre de l'en-tête, posé sur le fond pétrole.
     Version vectorielle, utilisée par les navigateurs qui l'acceptent ; les PNG
     de `scripts/generate-icons.mjs` couvrent Android et iOS. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ancrage">
  <rect width="512" height="512" fill="#0A1F21" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#12383A" stroke-width="28" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#7FD1B9" stroke-width="28"
    stroke-linecap="round" stroke-dasharray="942" stroke-dashoffset="330"
    transform="rotate(-90 256 256)" />
  <circle cx="256" cy="256" r="62" fill="#F5C542" />
</svg>
